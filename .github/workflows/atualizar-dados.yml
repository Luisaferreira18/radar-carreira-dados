# Atualiza os dados do painel toda semana e faz commit só se algo mudou.
# O commit dispara um novo deploy na Vercel automaticamente.
name: Atualizar dados

on:
  schedule:
    # toda segunda-feira às 10h UTC (7h em Brasília). O CAGED sai ~1x por mês,
    # então a maioria das execuções termina em "nada novo", sem commit.
    - cron: "0 10 * * 1"
  workflow_dispatch: # botão "Run workflow" na aba Actions, para rodar na hora

permissions:
  contents: write # necessário para o commit dos dados

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Atualizar dados
        id: atualizar
        continue-on-error: true # se uma fonte falhar, ainda salva o que deu certo
        run: python scripts/atualizar.py

      - name: Commit dos dados novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/raw data/processed
          if git diff --staged --quiet; then
            echo "Nenhum dado novo nas fontes."
          else
            git commit -m "dados: atualização automática de $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Avisar falha
        if: steps.atualizar.outcome == 'failure'
        run: |
          echo "::error::Uma ou mais fontes falharam. Veja o log da etapa 'Atualizar dados'."
          exit 1
